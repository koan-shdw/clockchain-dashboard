<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Search · Clockchain App</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=4" />
  <script>(function(){try{if(localStorage.getItem('ccapp-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body data-nav="search">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar" data-title="Advanced Search"></header>
      <div class="content">

        <div class="page-head">
          <h1>Advanced Search</h1>
          <p>Target the Clockchain attribute by attribute. Filled fields combine. <a class="more" href="search.html">← Simple search</a></p>
        </div>

        <div class="card">
          <div class="filters">
            <span class="flt-label">Filters</span>
            <label><input type="checkbox" data-cat="log" checked /> Logs</label>
            <label><input type="checkbox" data-cat="api" checked /> Timestamps</label>
            <label><input type="checkbox" data-cat="contract" /> Smart Contracts</label>
          </div>
          <div class="filters">
            <span class="flt-label">Date</span>
            <label><input type="radio" name="as-date" checked /> Today</label>
            <label><input type="radio" name="as-date" /> Last 30 days</label>
            <label><input type="radio" name="as-date" /> All time</label>
            <label><input type="radio" name="as-date" /> Custom</label>
            <input class="date-in" type="text" value="25-Aug-2026" aria-label="From" />
            <input class="date-in" type="text" value="25-Aug-2026" aria-label="To" />
          </div>

          <div class="cl-grid" style="margin-top:8px;">
            <div class="field"><label>Hash</label><input type="text" id="as-hash" class="mono" placeholder="0x…" /></div>
            <div class="field">
              <label>Unhashed content</label>
              <input type="text" id="as-content" placeholder="Text that was hashed" />
              <!-- pending Satish: may not be searchable system-side -->
            </div>
            <div class="field"><label>User ID</label><input type="text" id="as-user" class="mono" placeholder="usr_…" /></div>
            <div class="field"><label>Asset ID</label><input type="text" id="as-asset" /></div>
            <div class="field"><label>Asset Name</label><input type="text" id="as-name" /></div>
            <div class="field"><label>Block Height</label><input type="text" id="as-block" class="mono" placeholder="#…" /></div>
            <div class="field"><label>Version #</label><input type="text" id="as-ver" inputmode="numeric" /></div>
            <div class="field"><label>Hash Type</label><select id="as-type"><option>Any</option><option>SHA-256</option></select></div>
          </div>

          <button class="btn btn-primary" type="button" onclick="asRun()">Search Clockchain</button>
        </div>

        <div class="section card">
          <div class="card-head"><h3>Results</h3></div>
          <table class="table">
            <thead><tr><th>Type</th><th>Detail</th><th>Block</th><th>Status</th><th>When</th></tr></thead>
            <tbody id="as-rows"></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
  <script src="app.js?v=3"></script>
  <script src="search.js?v=1"></script>
  <script>
  window.asRun = function(){
    var f = {
      hash: document.getElementById('as-hash').value.trim(),
      content: document.getElementById('as-content').value.trim(),
      userId: document.getElementById('as-user').value.trim(),
      assetId: document.getElementById('as-asset').value.trim(),
      assetName: document.getElementById('as-name').value.trim(),
      block: document.getElementById('as-block').value.trim(),
      ver: document.getElementById('as-ver').value.trim()
    };
    CCSearch.render(CCSearch.advanced(f), document.getElementById('as-rows'));
  };
  asRun();
  </script>
</body>
</html>
